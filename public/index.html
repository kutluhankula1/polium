<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polium - NFT Flex Wall</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glow-gold { box-shadow: 0 0 25px rgba(234, 179, 8, 0.3); border: 2px solid rgba(234, 179, 8, 0.6); }
        .glow-card { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="min-h-screen pb-20">
 
    <!-- Navbar / Header -->
    <header class="border-b border-gray-800 bg-gray-950/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl font-extrabold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">POLIUM</span>
                <span class="text-xs bg-purple-900/60 text-purple-300 px-2 py-0.5 rounded-full border border-purple-700/50">NFT Flex Wall</span>
            </div>
            <button onclick="openModal()" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-semibold px-5 py-2.5 rounded-xl shadow-lg transition transform hover:scale-105">
                👑 Claim Your Throne
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 mt-8">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold tracking-tight mb-2">The Ultimate Flex Wall</h1>
            <p class="text-gray-400 text-sm max-w-md mx-auto">Parayı bas, NFT PFP'ni sergile, tahtı ele geçir. Topluluğun en güçlü cüzdanı sensin grupta göster!</p>
        </div>

        <!-- Flex Wall Grid / List -->
        <div id="flexWallContainer" class="space-y-4">
            <div class="text-center text-gray-500 py-10">Yükleniyor...</div>
        </div>
    </main>

    <!-- Submission Modal -->
    <div id="submissionModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-md p-6 glow-card relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl">✕</button>
            <h2 class="text-xl font-bold mb-4 text-purple-400">Join The Flex Wall</h2>
            
            <div class="mb-4 bg-gray-950 p-3 rounded-xl border border-gray-800">
                <p class="text-xs text-gray-400 mb-1">Deposit Address (USDT - BEP20):</p>
                <div class="flex justify-between items-center bg-gray-900 p-2 rounded border border-gray-800">
                    <span class="text-xs text-purple-300 font-mono truncate mr-2" id="depositAddr">0xf20710b8302e3a5a08dfaae4b2353d3fd4f0db4</span>
                    <button onclick="copyAddress()" class="bg-purple-600 hover:bg-purple-500 text-white text-xs px-3 py-1 rounded">Copy</button>
                </div>
            </div>

            <form id="flexForm" onsubmit="submitFlex(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">X (Twitter) Handle</label>
                    <input type="text" id="handleInput" placeholder="@kullaniciadi" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white focus:border-purple-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">NFT PFP Image URL (Görsel Linki)</label>
                    <input type="url" id="nftImgInput" placeholder="https://... (NFT görsel bağlantısı)" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white focus:border-purple-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Flex Message (Maks 80 karakter)</label>
                    <input type="text" id="msgInput" maxlength="80" placeholder="Örn: Bu koleksiyonun kralı benim 🚀" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white focus:border-purple-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Amount Sent (USDT)</label>
                    <input type="number" step="any" id="amountInput" placeholder="50.00" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white focus:border-purple-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Transaction ID (TxID)</label>
                    <input type="text" id="txidInput" placeholder="0x..." required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white focus:border-purple-500 outline-none">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-2.5 rounded-xl transition mt-2">
                    Submit to Telegram Review
                </button>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        function openModal() { document.getElementById('submissionModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('submissionModal').classList.add('hidden'); }
        
        function copyAddress() {
            navigator.clipboard.writeText(document.getElementById('depositAddr').innerText);
            alert('Adres kopyalandı!');
        }

        async function fetchFlexWall() {
            try {
                let res = await fetch('/api/telegram-bot');
                let data = await res.json();
                let users = data.users || [];
                
                let container = document.getElementById('flexWallContainer');
                if (users.length === 0) {
                    container.innerHTML = '<div class="text-center text-gray-500 py-10">Henüz kimse tahta oturmadı. İlk sen ol!</div>';
                    return;
                }

                let html = '';
                users.forEach((u, index) => {
                    let isKing = index === 0;
                    let rankBadge = isKing ? '👑 1. TAHT' : `#${index + 1}`;
                    let cardStyle = isKing ? 'glow-gold bg-gradient-to-r from-purple-950/40 via-gray-900 to-gray-900' : 'bg-gray-900/80 border border-gray-800';
                    let pfpUrl = u.nftImg || 'https://via.placeholder.com/150';

                    html += `
                        <div class="flex items-center justify-between p-4 rounded-2xl ${cardStyle} transition hover:border-purple-500/50">
                            <div class="flex items-center space-x-4">
                                <span class="text-lg font-bold w-12 text-center ${isKing ? 'text-yellow-400' : 'text-gray-400'}">${rankBadge}</span>
                                <img src="${pfpUrl}" alt="NFT" class="w-14 h-14 rounded-full object-cover border-2 border-purple-500/50 shadow-md">
                                <div>
                                    <div class="flex items-center space-x-2">
                                        <span class="font-bold text-white text-base">${u.name}</span>
                                        <span class="text-xs text-purple-400 bg-purple-950 px-2 py-0.5 rounded border border-purple-800/50">Verified</span>
                                    </div>
                                    <p class="text-xs text-gray-300 italic mt-1">"${u.message || ''}"</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="text-lg font-extrabold text-green-400">$${Number(u.amount).toFixed(2)}</span>
                                <span class="block text-[10px] text-gray-500 uppercase tracking-wider">USDT Flex</span>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (err) {
                console.error(err);
            }
        }

        async function submitFlex(e) {
            e.preventDefault();
            let btn = document.getElementById('submitBtn');
            btn.innerText = 'Gönderiliyor...';
            btn.disabled = true;

            let payload = {
                name: document.getElementById('handleInput').value,
                nftImg: document.getElementById('nftImgInput').value,
                message: document.getElementById('msgInput').value,
                amount: parseFloat(document.getElementById('amountInput').value),
                txid: document.getElementById('txidInput').value
            };

            try {
                let res = await fetch('/api/telegram-bot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                let data = await res.json();
                if (data.success) {
                    alert('Başvurunuz Telegram onay paneline gönderildi!');
                    closeModal();
                    document.getElementById('flexForm').reset();
                } else {
                    alert('Hata: ' + (data.error || 'Bilinmeyen hata'));
                }
            } catch (err) {
                alert('Bağlantı hatası!');
            } finally {
                btn.innerText = 'Submit to Telegram Review';
                btn.disabled = false;
            }
        }

        fetchFlexWall();
        setInterval(fetchFlexWall, 5000); // 5 saniyede bir anlık güncellenir
    </script>
</body>
</html>
