<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polium - Leaderboard & Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen">
 
    <!-- Üst Menü / Navbar -->
    <header class="flex justify-between items-center p-6 border-b border-slate-800">
        <h1 class="text-2xl font-black tracking-wider text-indigo-500">POLIUM</h1>
        
        <!-- Cüzdan Bağlantı Butonu -->
        <button id="connectWalletBtn" onclick="connectWallet()" style="background: #6366f1; color: white; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold;">
            🔌 Cüzdanı Bağla
        </button>
    </header>

    <!-- Ana İçerik Alanı -->
    <main class="max-w-4xl mx-auto p-6">
        <section class="text-center py-10">
            <h2 class="text-4xl font-bold mb-4">Make Your Mark. Be Seen.</h2>
            <p class="text-slate-400">Web3 Ekosistemine Hoş Geldin</p>
        </section>

        <!-- Tahta (Leaderboard) Alanı -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <h3 class="text-xl font-bold mb-6 text-indigo-400">Leaderboard</h3>
            <div id="flexWallContainer" class="space-y-4">
                <div class="text-center text-slate-500 py-10">Yükleniyor...</div>
            </div>
        </div>
    </main>

    <!-- JavaScript Kodları -->
    <script>
        // 1. Cüzdan Bağlama Fonksiyonu
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const userAccount = accounts[0];
                    const shortAddress = userAccount.substring(0, 6) + "..." + userAccount.substring(userAccount.length - 4);
                    
                    let btn = document.getElementById('connectWalletBtn');
                    btn.innerText = "✅ " + shortAddress;
                    btn.style.background = "#10b981";
                    
                    alert("Cüzdan başarıyla bağlandı: " + userAccount);
                } catch (error) {
                    alert("Cüzdan bağlantısı reddedildi.");
                }
            } else {
                alert("Lütfen tarayıcında MetaMask veya benzeri bir Web3 cüzdanı kurulu olduğundan emin ol!");
            }
        }

        // 2. Tahtayı (Leaderboard) Çeken Fonksiyon
        async function fetchFlexWall() {
            try {
                let res = await fetch('/api/telegram-bot');
                let data = await res.json();
                let users = data.users || [];

                let container = document.getElementById('flexWallContainer');
                if (users.length === 0) {
                    container.innerHTML = '<div class="text-center text-slate-500 py-10">Henüz kimse tahtaya oturmadı. İlk sen ol!</div>';
                    return;
                }

                let html = '';
                users.forEach((user, index) => {
                    html += `
                        <div class="flex items-center justify-between bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                            <div class="flex items-center space-x-4">
                                <span class="font-bold text-slate-400">#${index + 1}</span>
                                <img src="${user.nftImg}" alt="NFT" class="w-10 h-10 rounded-full object-cover border border-indigo-500">
                                <div>
                                    <div class="font-bold text-white">${user.name}</div>
                                    <div class="text-sm text-slate-400">"${user.message}"</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="font-bold text-emerald-400">$${user.amount}</div>
                                <div class="text-xs text-slate-500">USDT FLEX</div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (err) {
                console.error("Tahta yüklenirken hata:", err);
            }
        }

        // Sayfa açıldığında tahtayı yükle
        fetchFlexWall();
    </script>
</body>
</html>
