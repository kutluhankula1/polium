<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polium - Leaderboard & Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen">

    <!-- Üst Menü / Navbar -->
    <header class="flex justify-between items-center p-6 border-b border-slate-800">
        <h1 class="text-2xl font-black tracking-wider text-indigo-500">POLIUM</h1>
        
        <!-- Cüzdan Bağlantı Butonu -->
        <button id="connectWalletBtn" onclick="connectWallet()" class="flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl font-bold transition-all shadow-lg shadow-indigo-600/20">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 12V7H3v5m18 0v5H3v-5m18 0H3m15-4h.01M18 16h.01"></path>
            </svg>
            <span id="btnText">Connect Wallet</span>
        </button>
    </header>

    <!-- Ana İçerik Alanı -->
    <main class="max-w-4xl mx-auto p-6 space-y-8">
        <section class="text-center py-6">
            <h2 class="text-4xl font-bold mb-2">Make Your Mark. Be Seen.</h2>
            <p class="text-slate-400">Welcome to the Web3 Ecosystem & Feed</p>
        </section>

        <!-- Gönderi Paylaşma Alanı (Post Creation Box) -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <h3 class="text-lg font-bold mb-4 text-indigo-400">Create a Post</h3>
            <div class="space-y-4">
                <input type="text" id="postAuthor" placeholder="Your Handle / Name (e.g., @CryptoKing)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
                <textarea id="postContent" placeholder="What's happening in Web3?" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500"></textarea>
                <input type="text" id="postImage" placeholder="NFT Image Direct URL (.png / .jpg)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
                <button onclick="createPost()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold transition-all">Publish Post 🚀</button>
            </div>
        </div>

        <!-- Sosyal Akış (Feed) Alanı -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <h3 class="text-xl font-bold mb-6 text-indigo-400">Community Feed</h3>
            <div id="feedContainer" class="space-y-6">
                <div class="text-center text-slate-500 py-6">Loading feed...</div>
            </div>
        </div>

        <!-- Tahta (Leaderboard) Alanı -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <h3 class="text-xl font-bold mb-6 text-indigo-400">Leaderboard</h3>
            <div id="flexWallContainer" class="space-y-4">
                <div class="text-center text-slate-500 py-10">Loading leaderboard...</div>
            </div>
        </div>
    </main>

    <!-- JavaScript Kodları -->
    <script>
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const shortAddress = accounts[0].substring(0, 6) + "..." + accounts[0].substring(accounts[0].length - 4);
                    let btn = document.getElementById('connectWalletBtn');
                    btn.style.background = "#10b981";
                    document.getElementById('btnText').innerText = shortAddress;
                } catch (error) {
                    alert("Wallet connection request was rejected.");
                }
            } else {
                alert("Please make sure MetaMask or a Web3 wallet is installed in your browser!");
            }
        }

        async function fetchFlexWall() {
            try {
                let res = await fetch('/api/telegram-bot');
                let data = await res.json();
                let users = data.users || [];

                let container = document.getElementById('flexWallContainer');
                if (users.length === 0) {
                    container.innerHTML = '<div class="text-center text-slate-500 py-10">No entries on the board yet. Be the first one!</div>';
                    return;
                }

                let html = '';
                users.forEach((user, index) => {
                    html += `
                        <div class="flex items-center justify-between bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                            <div class="flex items-center space-x-4">
                                <span class="font-bold text-slate-400">#${index + 1}</span>
                                <img src="${user.nftImg}" alt="NFT" class="w-10 h-10 rounded-full object-cover border border-indigo-500">
                                <div>
                                    <div class="font-bold text-white">${user.name}</div>
                                    <div class="text-sm text-slate-400">"${user.message}"</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="font-bold text-emerald-400">$${user.amount}</div>
                                <div class="text-xs text-slate-500">USDT FLEX</div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (err) {
                console.error("Error loading leaderboard:", err);
            }
        }

        // Basit bir örnek akış gösterimi (Şimdilik geçici arayüz)
        function loadFeed() {
            let feedContainer = document.getElementById('feedContainer');
            feedContainer.innerHTML = `
                <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50 space-y-3">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center font-bold">P</div>
                        <div>
                            <div class="font-bold text-sm">@PoliumOfficial</div>
                            <div class="text-xs text-slate-500">Just now</div>
                        </div>
                    </div>
                    <p class="text-sm text-slate-300">Welcome to the brand new Polium social feed! Share your thoughts and showcase your NFTs here.</p>
                </div>
            `;
        }

        function createPost() {
            alert("Post feature backend integration is coming up next! Stay tuned.");
        }

        fetchFlexWall();
        loadFeed();
    </script>
</body>
</html>
